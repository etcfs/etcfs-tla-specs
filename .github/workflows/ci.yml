name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tla-check:
    name: Check the fencing and cached-lock models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # 2-node models only (~30s): the 3-node model (DEEP=1) is a manual,
      # multi-minute confirmation, not something every push should pay for.
      - run: ./check.sh
