\* Broken variant: a create whose commit the node never learns about leaves its
\* lock key standing. No node believes it holds the inode, so no node can
\* release it, and every peer that wants the inode blocks on a key nothing will
\* ever delete — until the lock session that leased it ends.
SPECIFICATION OrphanSpec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE
    DiscardOrphanedKey = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    OrphanFreed

\* A model that runs out of lock sessions has nothing left to do, and a state
\* with no successors is not a bug here — the liveness property below is what
\* says whether the key was freed before everything stopped.
CHECK_DEADLOCK FALSE
