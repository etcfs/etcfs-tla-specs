\* The implemented protocol, as in Fencing.cfg, with three nodes. Run only by
\* DEEP=1 ./check.sh. All invariants must hold.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2, n3}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "reliable"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = TRUE
    FenceChecksIncarnation = TRUE
    HonorDeparture = TRUE
    DepartureIsQuiescent = TRUE

INVARIANTS
    TypeOK
    NoDoubleWriter
    NoWedgedNode
    NoHealthyNodeSevered
    StaleWriteRejected
    ReleasedArenaHasNoLiveWriter

PROPERTIES
    GenerationMonotone

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
