\* The incarnation check is off, but the generation guard is on: even when a
\* fence wrongly severs a re-registered node, no stale commit is accepted.
\* Only StaleWriteRejected is checked, and it must hold.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "reliable"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = TRUE
    FenceChecksIncarnation = FALSE
    HonorDeparture = TRUE
    DepartureIsQuiescent = TRUE

INVARIANTS
    TypeOK
    StaleWriteRejected
PROPERTIES
    GenerationMonotone

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
