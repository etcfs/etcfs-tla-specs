\* Broken variant: the kernel's data pages are left in place when the lock is
\* yielded, so this node goes on answering reads from them while a peer owns
\* the inode. A page cache has no timeout, so nothing corrects it.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = FALSE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE

INVARIANTS
    TypeOK
    NoStalePages

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
