\* A fencer that may fail. Arena release requires a reliable fencer, so in
\* this mode a fenced node's arenas are leaked. All invariants must hold.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "unreliable"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = TRUE
    FenceChecksIncarnation = TRUE
    HonorDeparture = TRUE
    DepartureIsQuiescent = TRUE

INVARIANTS
    TypeOK
    NoDoubleWriter
    NoWedgedNode
    NoHealthyNodeSevered
    StaleWriteRejected
    ReleasedArenaHasNoLiveWriter

PROPERTIES
    GenerationMonotone

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
