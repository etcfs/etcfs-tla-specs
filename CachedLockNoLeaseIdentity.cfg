\* Broken variant: the cached lock is trusted while any session is alive,
\* rather than while the session its key was written under is still the
\* current one. The stale holder and the new one then both believe they hold
\* the inode.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = FALSE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE
    DiscardOrphanedKey = TRUE

INVARIANTS
    TypeOK
    NoTwoHolders

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
