\* The incarnation check removed: the protocol as it stood BEFORE the fix in
\* pkg/fencing/controller.go.  Documents the defect TLC found, and must keep
\* producing a counterexample -- a broken variant that stops failing means
\* the invariant has lost its teeth.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "reliable"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = TRUE
    FenceChecksIncarnation = FALSE
    HonorDeparture = TRUE
    DepartureIsQuiescent = TRUE

INVARIANTS
    TypeOK
    NoDoubleWriter
    NoWedgedNode
    NoHealthyNodeSevered
    StaleWriteRejected
    ReleasedArenaHasNoLiveWriter

PROPERTIES
    GenerationMonotone

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
