\* The broken variant of the departure protocol: a node gives its arenas back
\* and announces that it left on purpose, but has NOT actually stopped -- it is
\* still running, still believes it owns those arenas, and can still reach the
\* device.
\*
\* Deliberately not the "announces while still owning arenas" mutation, which
\* proves nothing: the arena check in the controller catches that one, and a
\* model of it passes.  This is the case that check cannot see -- the records
\* are clean and the node is alive anyway -- so it isolates the property the
\* records cannot supply.
\*
\* Peers honour the announcement and skip the fence, so nothing ever severs the
\* node.  ReleasedArenaHasNoLiveWriter breaks at the moment of the departure
\* itself: the arena is back in the free pool while its previous owner can
\* still write to it.  NoDoubleWriter follows a step later, once a peer claims
\* it, but the released-arena invariant is the earlier and more precise symptom.
\*
\* That is what makes the ordering in leaveCluster load-bearing rather than
\* tidy -- the IPC server stops, and only then does anything go back.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "reliable"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = TRUE
    FenceChecksIncarnation = TRUE
    HonorDeparture = TRUE
    DepartureIsQuiescent = FALSE

INVARIANTS
    TypeOK
    NoDoubleWriter
    NoWedgedNode
    NoHealthyNodeSevered
    StaleWriteRejected
    ReleasedArenaHasNoLiveWriter

PROPERTIES
    GenerationMonotone

SYMMETRY Symmetry
