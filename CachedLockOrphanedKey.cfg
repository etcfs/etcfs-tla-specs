\* A create's lock key can be left standing when the node never learns its
\* transaction committed. This configuration asserts the window always ends:
\* the node deletes the key by the token only it ever had.
SPECIFICATION OrphanSpec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE
    DiscardOrphanedKey = TRUE

INVARIANTS
    TypeOK

PROPERTIES
    OrphanFreed

\* A model that runs out of lock sessions has nothing left to do, and a state
\* with no successors is not a bug here — the liveness property below is what
\* says whether the key was freed before everything stopped.
CHECK_DEADLOCK FALSE

\* No SYMMETRY: TLC's liveness checking is not sound under it.
