\* Broken variant: a recall yields the key without publishing what this node
\* has buffered. No later flush can ever publish it -- the key is the flush's
\* own comparison -- so the acknowledged writes are gone.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = FALSE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE

INVARIANTS
    TypeOK
    NoLostAckedWrite

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
