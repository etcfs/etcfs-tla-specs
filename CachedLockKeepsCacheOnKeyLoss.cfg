\* Broken variant: a node that finds its lock key gone keeps everything it had
\* cached under it. The kernel's pages are the copy it cannot take back later.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = FALSE

INVARIANTS
    TypeOK
    NoStalePages

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
