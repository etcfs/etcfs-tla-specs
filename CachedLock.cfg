\* The protocol as implemented: the cached lock validated by lease identity,
\* the flush guarded by the lock key, and every cache dropped with that key.
\* All invariants must hold.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE
    DiscardOrphanedKey = TRUE

INVARIANTS
    TypeOK
    NoTwoHolders
    NoPublishWithoutLock
    NoLostAckedWrite
    NoStalePages
    ViewMatchesTruth

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
