\* Broken variant: no fencer is configured, yet a fenced node's arenas are
\* reclaimed anyway (ReleaseNeedsFencer = FALSE). Nothing has proved the node
\* stopped writing, so a peer given the arena becomes a second writer.
\* Must break ReleasedArenaHasNoLiveWriter.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    Arenas = {a1, a2}
    NoNode = none
    MaxGen = 2
    FencerMode = "none"
    GuardEnabled = TRUE
    ReleaseNeedsFencer = FALSE
    FenceChecksIncarnation = TRUE
    HonorDeparture = TRUE
    DepartureIsQuiescent = TRUE

INVARIANTS
    TypeOK
    NoDoubleWriter
    NoWedgedNode
    NoHealthyNodeSevered
    StaleWriteRejected
    ReleasedArenaHasNoLiveWriter

PROPERTIES
    GenerationMonotone

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
