\* Broken variant: the flush transaction carries no comparison on this node's
\* own lock key, so a node that lost the inode publishes over the peer that
\* took it.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = FALSE
    RecallFlushes = TRUE
    InvalidateOnYield = TRUE
    DropSnapshotOnYield = TRUE
    DropCacheOnKeyLoss = TRUE
    DiscardOrphanedKey = TRUE

INVARIANTS
    TypeOK
    NoPublishWithoutLock

\* Nodes are interchangeable, so permuting them cannot change whether an
\* invariant holds; declaring the symmetry lets TLC collapse those states.
SYMMETRY Symmetry
