\* Broken variant: the metadata snapshot outlives the key it was read under,
\* so a re-acquisition serves what the inode looked like before a peer had it.
SPECIFICATION Spec

CONSTANTS
    Nodes = {n1, n2}
    NoNode = none
    MaxVal = 2
    MaxLease = 2
    LeaseIdentityChecked = TRUE
    FlushChecksKey = TRUE
    RecallFlushes = TRUE
